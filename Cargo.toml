[package]
name = "peckboard-ui-gauge-plugin"
version = "0.3.0"
edition = "2024"
description = "Steer UI-generating agents toward the user's taste: generate marked-up HTML pages in a temp agent session, give per-element feedback (like a document review), and compose a per-folder UI preference prompt — toggleable onto every chat session in a folder — with starred-element screenshots agents fetch as visual references."
repository = "https://github.com/PeckBoard/ui-gauge"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_ui_gauge_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
