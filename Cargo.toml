[package]
name = "peckboard-ui-gauge-plugin"
version = "0.2.3"
edition = "2024"
description = "Gauge UI design quality against user-ranked baselines: generate baseline UIs with one button, rate each 1-10 per category, and let high-rated changes build a living overall baseline prompt; agents score worker output on the same calibrated scale and subpar results become follow-up cards."
repository = "https://github.com/PeckBoard/ui-gauge"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_ui_gauge_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
